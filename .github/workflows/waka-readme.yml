name: Waka Readme

on:
  schedule:
    - cron: '0 15 * * *'  # 매일 자정 UTC 실행
  workflow_dispatch:       # 수동 실행도 가능

jobs:
  update-readme:
    name: Update Readme with Metrics
    runs-on: ubuntu-latest
    steps:
      - uses: anmol098/waka-readme-stats@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          SHOW_TOTAL_CODE_TIME: true   # 누적 총합
          SHOW_LINES_OF_CODE: true
          SHOW_DAYS_OF_WEEK: true
          SHOW_SHORT_INFO: false        # 🐱 My GitHub Data 섹션
          SHOW_LANGUAGE_PER_REPO: false # I Mostly Code in...
          SHOW_LOC_CHART: false         # Timeline 차트
          SHOW_UPDATED_DATE: false      # Last Updated on...
